<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版本历史 · DFSVS</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .branch-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .branch-chip {
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--border);
    padding:5px 12px; border-radius:20px; font-size:12.5px; font-family:var(--mono);
  }
  .branch-chip:hover { border-color:var(--accent); }
  .branch-chip.head { background:var(--accent-soft); border-color:var(--accent); color:#cfe0ff; }
  .branch-chip .cnt { color:var(--muted); font-size:11px; }
  .lane-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:2px; }
  .cf-file { color:var(--bad); font-family:var(--mono); font-size:12px; }
  .impact-report { display:flex; flex-direction:column; gap:10px; }
  .impact-summary { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .impact-panel { border:1px solid var(--border); border-radius:10px; background:var(--panel-2); overflow:hidden; }
  .impact-panel > summary { cursor:pointer; padding:9px 12px; font-weight:600; font-size:13px; user-select:none; }
  .impact-panel[open] > summary { border-bottom:1px solid var(--border-soft); }
  .impact-panel-body { padding:9px 12px; display:flex; flex-direction:column; gap:7px; }
  .impact-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .impact-table th, .impact-table td { padding:7px 8px; border-bottom:1px solid var(--border-soft); vertical-align:top; }
  .impact-table th { color:var(--muted); text-align:left; font-weight:500; white-space:nowrap; }
  .impact-path { font-family:var(--mono); word-break:break-all; }
  .impact-lines { font-family:var(--mono); color:var(--muted); white-space:nowrap; font-size:11.5px; }
  .risk-item { border-left:3px solid var(--border); padding:7px 9px; background:rgba(255,255,255,.025); border-radius:6px; }
  .risk-item.high { border-left-color:var(--bad); background:var(--bad-soft); }
  .risk-item.medium { border-left-color:var(--warn); background:var(--warn-soft); }
  .risk-item.low { border-left-color:var(--info); background:rgba(57,188,208,.08); }
  .risk-head { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:3px; }
  .risk-reason { font-size:12.5px; line-height:1.55; }
  .risk-fix { color:var(--muted); font-size:12px; margin-top:2px; }
  .impact-mini-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:6px; }
  .impact-mini { border:1px solid var(--border-soft); border-radius:8px; padding:7px 9px; font-size:12px; }
  .impact-mini b { display:block; font-family:var(--mono); font-size:15px; margin-top:2px; }
  .impact-empty { color:var(--muted); font-size:12.5px; padding:8px 0; }
</style>
</head>
<body>
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">版本历史</h1>
        <div class="sub" id="page-sub">提交时间线 · 分支 · 三方合并与冲突处理</div>
      </div>
      <div class="spacer"></div>
      <div class="userchip" id="userchip"></div>
    </header>

    <section class="content">
      <!-- 分支栏 -->
      <div class="card">
        <div class="card-title">分支
          <span class="hint" id="dirty-hint"></span>
          <span class="spacer"></span>
          <button class="btn sm primary" id="btn-commit">✔ 提交工作区</button>
          <button class="btn sm" id="btn-branch">⑂ 新建分支</button>
          <button class="btn sm" id="btn-merge">⇄ 合并…</button>
          <button class="btn sm" id="btn-checkout" title="把选中分支物化到文件系统">⎇ 检出</button>
        </div>
        <div class="branch-bar" id="branch-bar"></div>
      </div>

      <div class="split-view">
        <!-- 时间线 -->
        <div class="side grow">
          <div class="card">
            <div class="card-title">提交时间线 <span class="hint" id="tl-hint"></span>
              <span class="spacer"></span>
              <button class="btn xs ghost" id="btn-more">加载更多</button>
            </div>
            <div class="timeline" id="timeline"></div>
          </div>
        </div>

        <!-- 文件历史侧栏 -->
        <div class="side fixed">
          <div class="card" id="file-hist-card" style="display:none">
            <div class="card-title"><span id="fh-title">文件历史</span>
              <span class="spacer"></span><button class="btn xs ghost" id="fh-close">✕</button>
            </div>
            <div id="fh-body"></div>
          </div>
          <div class="card">
            <div class="card-title">仓库统计</div>
            <div id="repo-stats" class="kv"></div>
          </div>
          <div class="card">
            <div class="card-title">操作说明</div>
            <div class="small dim" style="line-height:1.8">
              · <b>提交</b>把当前文件树快照存入版本树（块引用不可变）<br>
              · <b>合并</b>以 LCA 为 base 做三方合并；文本冲突写入
              <span class="mono"><<<<<<<</span> 标记<br>
              · <b>提交/合并前</b>会先列出波及目录、文件、行段和其它分支的同文件改动<br>
              · <b>检出</b>将分支头快照物化回文件系统（未提交修改会自动提交保护）<br>
              · 点击提交可展开变更文件，点击文件名查看该提交的行级差异
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="toasts"></div>
<script src="js/app.js"></script>
<script>
"use strict";
const { api, esc, fmtTs, fmtAgo, toast, modal, confirmDlg, promptDlg } = DFSVS;

let curBranch = DFSVS.qs("branch", "") || null;   // null => head_branch
let headBranch = "main";
let shownCommits = 30;
const LANE_COLORS = ["#4f8cff", "#9b6cff", "#2fbf71", "#f0a538", "#39bcd0", "#f26ca7"];

// ------------------------------------------------------------------ 分支
async function loadBranches() {
  const d = await api("GET", "/api/version/branches");
  headBranch = d.head_branch;
  if (!curBranch) curBranch = headBranch;
  const bar = document.getElementById("branch-bar");
  bar.innerHTML = d.branches.map(b => `
    <span class="branch-chip ${b.name === curBranch ? "head" : ""}" data-b="${esc(b.name)}"
          title="${esc(b.desc || "")}">
      ${b.is_head ? "★" : "⑂"} ${esc(b.name)}
      <span class="cnt">${b.commit_count}c${b.dirty ? " · 脏" : ""}</span>
      ${b.name !== "main" ? `<span class="cnt del-br" data-b="${esc(b.name)}" title="删除分支">✕</span>` : ""}
    </span>`).join("");
  bar.querySelectorAll(".branch-chip").forEach(el => {
    el.onclick = (e) => {
      if (e.target.classList.contains("del-br")) {
        const name = e.target.dataset.b;
        confirmDlg(`删除分支 ${name}？（提交仍保留在版本树中）`, async () => {
          try { await api("POST", "/api/version/branch_delete", { name });
                toast("分支已删除", "ok"); if (curBranch === name) curBranch = null; loadAll(); }
          catch (err) { toast(err.message, "bad"); }
        }, true);
        return;
      }
      curBranch = el.dataset.b;
      shownCommits = 30;
      loadAll();
    };
  });
  // 工作区脏标记
  try {
    const wd = await api("GET", "/api/version/working_diff?branch=" + encodeURIComponent(headBranch));
    document.getElementById("dirty-hint").innerHTML = wd.dirty
      ? `<span class="badge warn">工作区有 ${wd.stats.files} 个文件未提交</span>`
      : `<span class="badge ok">工作区干净（HEAD = ${headBranch}）</span>`;
  } catch (e) {}
}

// ------------------------------------------------------------------ 时间线
async function loadTimeline() {
  if (!curBranch) curBranch = headBranch || "main";
  const d = await api("GET", `/api/version/graph?branch=${encodeURIComponent(curBranch)}&limit=${shownCommits}`);
  document.getElementById("tl-hint").textContent =
    `分支 ${d.branch} · 共 ${d.total} 个提交（显示 ${d.commits.length}）`;
  const box = document.getElementById("timeline");
  if (!d.commits.length) {
    box.innerHTML = `<div class="empty"><div class="big">⑂</div>该分支还没有提交</div>`;
    return;
  }
  box.innerHTML = d.commits.map(c => `
    <div class="tl-item ${c.is_merge ? "merge" : ""} ${c.conflicts && c.conflicts.length ? "conflict" : ""}" data-id="${esc(c.id)}">
      <div class="tl-head">
        <span class="lane-dot" style="background:${LANE_COLORS[c.lane || 0]}"></span>
        <span class="chip">${esc(c.short)}</span>
        ${c.is_merge ? '<span class="badge violet plain">merge</span>' : ""}
        ${(c.refs || []).map(r => `<span class="badge ${r === headBranch ? "acc" : "dim"} plain">${esc(r)}${r === headBranch ? " ★" : ""}</span>`).join(" ")}
        <span class="tl-msg">${esc(c.message)}</span>
      </div>
      <div class="tl-meta">
        ${esc(c.author)} · ${fmtTs(c.ts)}（${fmtAgo(c.ts)}）
        · 父 ${c.parents_short.length ? c.parents_short.map(esc).join(", ") : "（根提交）"}
        ${c.stats ? ` · <span style="color:var(--ok)">+${c.stats.added || 0}</span> <span style="color:var(--bad)">-${c.stats.deleted || 0}</span> ~${c.stats.modified || 0}` : ""}
        · tree ${esc(c.tree_hash)}
      </div>
      ${c.conflicts && c.conflicts.length ? `
        <div style="margin-top:6px">
          <span class="badge bad plain">合并冲突 ${c.conflicts.length}</span>
          ${c.conflicts.map(x => `<span class="cf-file">${esc(x.path)}（${esc(x.kind)}）</span>`).join(" ")}
        </div>` : ""}
      <div class="tl-files"><div class="small muted">展开中 …</div></div>
    </div>`).join("");
  box.querySelectorAll(".tl-item").forEach(el => {
    el.onclick = async () => {
      const wasOpen = el.classList.contains("open");
      box.querySelectorAll(".tl-item.open").forEach(x => x.classList.remove("open"));
      if (wasOpen) return;
      el.classList.add("open");
      const filesBox = el.querySelector(".tl-files");
      if (filesBox.dataset.loaded) return;
      try {
        const id = el.dataset.id;
        const parent = (await commitRaw(id)).parent_ids[0] || "";
        const d = await api("GET", `/api/version/diff?a=${encodeURIComponent(parent)}&b=${encodeURIComponent(id)}`);
        filesBox.innerHTML = renderChanges(d.changes, d.stats, parent, id);
        bindChangeClicks(filesBox, parent, id);
        filesBox.dataset.loaded = "1";
      } catch (e) {
        filesBox.innerHTML = `<div class="small muted">加载失败：${esc(e.message)}</div>`;
      }
    };
  });
}

async function commitRaw(id) {
  // 通过 commits 列表接口拿 parent（graph 已含 parents_short，但需要完整 id）
  const d = await api("GET", `/api/version/commits?branch=${encodeURIComponent(curBranch)}&limit=200`);
  const c = d.commits.find(x => x.id === id);
  return c || { parent_ids: [] };
}

function renderChanges(changes, stats, a, b) {
  if (!changes.length) return `<div class="small muted" style="padding:6px 0">（与父提交相比无文件变化）</div>`;
  return `
    <div class="small muted" style="margin-bottom:4px">
      ${stats.files} 个文件变化（<span style="color:var(--ok)">+${stats.adds}</span> /
      <span style="color:var(--bad)">-${stats.dels}</span> 行）</div>
    ${changes.map(ch => `
      <div class="chg-row" data-p="${esc(ch.path)}" style="display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer">
        <span class="badge plain ${ch.kind === "added" ? "ok" : ch.kind === "deleted" ? "bad" : "warn"}">${ch.kind === "added" ? "A" : ch.kind === "deleted" ? "D" : "M"}</span>
        <span class="mono small" style="flex:1">${esc(ch.path)}</span>
        ${ch.adds !== undefined ? `<span class="small mono"><span style="color:var(--ok)">+${ch.adds}</span> <span style="color:var(--bad)">-${ch.dels}</span></span>` : ""}
        ${ch.binary ? '<span class="badge dim plain">二进制</span>' : ""}
        <span class="small muted mono">${DFSVS.fmtBytes(ch.new_size || ch.old_size)}</span>
      </div>`).join("")}`;
}

function bindChangeClicks(container, a, b) {
  container.querySelectorAll(".chg-row").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const p = el.dataset.p;
      location.href = `diff.html?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}&path=${encodeURIComponent(p)}`;
    };
  });
}

document.getElementById("btn-more").onclick = () => { shownCommits += 30; loadTimeline(); };

// ------------------------------------------------------------------ 影响分析
function kindBadge(kind) {
  const cls = kind === "added" ? "ok" : kind === "deleted" ? "bad" : "warn";
  const txt = kind === "added" ? "A" : kind === "deleted" ? "D" : "M";
  return `<span class="badge plain ${cls}">${txt}</span>`;
}

function rangeText(start, end) {
  if (!start && !end) return "—";
  return start === end ? String(start) : `${start}-${end}`;
}

function hunkText(ch) {
  if (ch.binary) return "二进制";
  if (ch.too_large) return "大文件（未计算行）";
  if (!ch.hunks || !ch.hunks.length) {
    if (ch.kind === "added") return `新增 ${ch.new_size || 0} B`;
    if (ch.kind === "deleted") return `删除 ${ch.old_size || 0} B`;
    return "行级信息不可用";
  }
  return ch.hunks.slice(0, 4).map(h => {
    if (h.kind === "insert") return `新 ${rangeText(h.new_start, h.new_end)}`;
    if (h.kind === "delete") return `旧 ${rangeText(h.old_start, h.old_end)}`;
    return `旧 ${rangeText(h.old_start, h.old_end)} → 新 ${rangeText(h.new_start, h.new_end)}`;
  }).join("；") + (ch.hunks.length > 4 ? ` 等 ${ch.hunks.length} 段` : "");
}

function renderImpactFiles(changes, options = {}) {
  if (!changes.length) return `<div class="impact-empty">无文件变化</div>`;
  return `<div class="table-wrap"><table class="impact-table">
    <thead><tr><th>状态</th><th>文件</th><th>受影响行</th><th>行增删</th><th>大小</th></tr></thead>
    <tbody>${changes.map(ch => `
      <tr class="${options.link ? "chg-row" : ""}" data-p="${esc(ch.path)}" ${options.link ? "style=\"cursor:pointer\"" : ""}>
        <td>${kindBadge(ch.kind)}</td>
        <td class="impact-path">${esc(ch.path)}</td>
        <td class="impact-lines">${esc(hunkText(ch))}</td>
        <td class="impact-lines">${ch.adds !== undefined ? `<span style="color:var(--ok)">+${ch.adds}</span> / <span style="color:var(--bad)">-${ch.dels}</span>` : "—"}</td>
        <td class="impact-lines">${DFSVS.fmtBytes(ch.new_size || ch.old_size || 0)}</td>
      </tr>`).join("")}</tbody>
  </table></div>`;
}

function renderDirectories(dirs) {
  if (!dirs.length) return `<div class="impact-empty">无目录变化</div>`;
  return `<div class="table-wrap"><table class="impact-table">
    <thead><tr><th>目录</th><th>波及文件</th><th>A / M / D</th><th>行增删</th></tr></thead>
    <tbody>${dirs.slice(0, 30).map(d => `
      <tr>
        <td class="impact-path">${esc(d.path)}/</td>
        <td>${d.files}</td>
        <td class="impact-lines">${d.added} / ${d.modified} / ${d.deleted}</td>
        <td class="impact-lines"><span style="color:var(--ok)">+${d.adds}</span> / <span style="color:var(--bad)">-${d.dels}</span></td>
      </tr>`).join("")}</tbody>
  </table></div>`;
}

function renderRisks(risks) {
  if (!risks.length) {
    return `<div class="risk-item low"><div class="risk-reason">未发现落在具体文件上的冲突风险；仍建议按影响清单回归相关目录。</div></div>`;
  }
  return risks.map(r => `
    <div class="risk-item ${esc(r.severity)}">
      <div class="risk-head">
        <span class="badge plain ${r.severity === "high" ? "bad" : r.severity === "medium" ? "warn" : "info"}">${r.severity === "high" ? "高风险" : r.severity === "medium" ? "需确认" : "低风险"}</span>
        <span class="impact-path">${esc(r.path || "-")}</span>
        ${r.kind ? `<span class="badge dim plain">${esc(r.kind)}</span>` : ""}
        ${(r.branches || []).map(b => `<span class="badge acc plain">${esc(b)}</span>`).join("")}
      </div>
      <div class="risk-reason">${esc(r.reason || "")}</div>
      <div class="risk-fix">建议：${esc(r.suggestion || "复核后再继续")}</div>
    </div>`).join("");
}

function renderParallel(branches) {
  if (!branches.length) return `<div class="impact-empty">没有其它分支同时改这些路径</div>`;
  return branches.map(b => `
    <div class="risk-item ${b.high ? "high" : b.medium ? "medium" : "low"}">
      <div class="risk-head"><span class="badge acc plain">${esc(b.branch)}</span>
        ${b.high ? `<span class="badge bad plain">${b.high} 高</span>` : ""}
        ${b.medium ? `<span class="badge warn plain">${b.medium} 中</span>` : ""}
        ${b.low ? `<span class="badge info plain">${b.low} 低</span>` : ""}
      </div>
      <div class="impact-path small">${b.paths.map(esc).join("、")}</div>
    </div>`).join("");
}

function renderImpactStats(stats, mode) {
  const extra = mode === "merge" ? `
    <div class="impact-mini">未提交文件<b>${stats.working?.files ?? 0}</b></div>
    <div class="impact-mini">入站文件<b>${stats.incoming?.files ?? 0}</b></div>` : "";
  return `<div class="impact-mini-grid">
    <div class="impact-mini">波及文件<b>${stats.files}</b></div>
    <div class="impact-mini">新增 / 修改 / 删除<b>${stats.added} / ${stats.modified} / ${stats.deleted}</b></div>
    <div class="impact-mini">行增删<b><span style="color:var(--ok)">+${stats.adds}</span> / <span style="color:var(--bad)">-${stats.dels}</span></b></div>
    <div class="impact-mini">高 / 中 / 低风险<b>${stats.risk_high} / ${stats.risk_medium} / ${stats.risk_low}</b></div>
    ${extra}
  </div>`;
}

function renderImpactReport(d, options = {}) {
  const high = d.stats.risk_high || 0;
  const summaryCls = high ? "bad" : (d.stats.risk_medium ? "warn" : "ok");
  const workingPanel = d.mode === "merge" ? `
    <details class="impact-panel">
      <summary>未提交改动（${d.working_changes.length}）</summary>
      <div class="impact-panel-body">${renderImpactFiles(d.working_changes)}</div>
    </details>` : "";
  const incomingPanel = d.mode === "merge" ? `
    <details class="impact-panel">
      <summary>源分支入站改动（${d.incoming_changes.length}）</summary>
      <div class="impact-panel-body">${renderImpactFiles(d.incoming_changes)}</div>
    </details>` : "";
  return `<div class="impact-report">
    <div class="impact-summary">
      <span class="badge ${summaryCls}">${high ? "存在高风险" : d.stats.risk_medium ? "存在需确认项" : "可继续"}</span>
      <span class="small">${esc(d.summary || "")}</span>
    </div>
    ${renderImpactStats(d.stats, d.mode)}
    ${workingPanel}${incomingPanel}
    <details class="impact-panel" open>
      <summary>完整文件与行影响清单（${d.changes.length}）</summary>
      <div class="impact-panel-body">${renderImpactFiles(d.changes, { link: !!options.link })}</div>
    </details>
    <details class="impact-panel">
      <summary>波及目录（${d.directories.length}）</summary>
      <div class="impact-panel-body">${renderDirectories(d.directories)}</div>
    </details>
    <details class="impact-panel" ${high ? "open" : ""}>
      <summary>具体风险提示（${d.risks.length}）</summary>
      <div class="impact-panel-body">${renderRisks(d.risks)}</div>
    </details>
    <details class="impact-panel">
      <summary>同时改动的其它分支（${d.parallel_branches.length}）</summary>
      <div class="impact-panel-body">${renderParallel(d.parallel_branches)}</div>
    </details>
  </div>`;
}

// ------------------------------------------------------------------ 提交
document.getElementById("btn-commit").onclick = async () => {
  const body = document.createElement("div");
  body.innerHTML = `
    <label class="fl" style="margin-bottom:10px">提交信息
      <textarea id="cm-msg" rows="2" placeholder="例如 feat: 支持分块上传断点续传"></textarea></label>
    <div class="small muted" style="margin-bottom:6px">将提交到分支 <b>${esc(headBranch)}</b>，先预检影响范围与并行分支：</div>
    <div id="cm-impact" class="scroll-y" style="max-height:52vh"><div class="impact-empty">正在分析…</div></div>
    <label id="cm-ack-wrap" class="small" style="display:none;margin-top:8px">
      <input type="checkbox" id="cm-ack"> 我已了解上述具体文件风险，仍要提交
    </label>`;
  const m = modal({
    title: "提交前影响分析", body, wide: true, okText: "确认提交",
    onOk: async (bodyEl) => {
      const d = bodyEl._impact;
      const msg = bodyEl.querySelector("#cm-msg").value.trim();
      if (!msg) { toast("请填写提交信息", "warn"); return false; }
      if (d && d.stats.risk_high && !bodyEl.querySelector("#cm-ack").checked) {
        toast("请先勾选确认已了解高风险文件", "warn");
        return false;
      }
      try {
        const r = await api("POST", "/api/version/commit", { message: msg });
        toast(`已提交 ${r.commit.short}（${r.stats.files_changed} 个文件）`, "ok");
        loadAll();
      } catch (e) { toast("提交失败：" + e.message, "bad"); return false; }
    }
  });
  try {
    const d = await api("GET", `/api/version/commit_preview?branch=${encodeURIComponent(headBranch)}`);
    body._impact = d;
    body.querySelector("#cm-impact").innerHTML = renderImpactReport(d, { link: true });
    body.querySelector("#cm-ack-wrap").style.display = d.stats.risk_high ? "" : "none";
    bindChangeClicks(body, "HEAD", "WORKING");
    if (!d.changes.length) m.el.querySelector(".m-ok").disabled = true;
  } catch (e) {
    body.querySelector("#cm-impact").innerHTML = `<div class="badge bad plain">预检失败：${esc(e.message)}</div>`;
    m.el.querySelector(".m-ok").disabled = true;
  }
};

// ------------------------------------------------------------------ 分支
document.getElementById("btn-branch").onclick = async () => {
  const brs = await api("GET", "/api/version/branches");
  promptDlg("新建分支", [
    { name: "name", label: "分支名", placeholder: "feature-xyz" },
    { name: "from", label: "起点", type: "select",
      options: brs.branches.map(b => ({ value: b.name, label: `${b.name}（${b.head_short || "空"}）` })) },
    { name: "desc", label: "描述（可选）" },
  ], async (v) => {
    try {
      await api("POST", "/api/version/branch", v);
      toast(`分支 ${v.name} 已创建`, "ok");
      curBranch = v.name;
      loadAll();
    } catch (e) { toast("创建失败：" + e.message, "bad"); }
  });
};

// ------------------------------------------------------------------ 合并
document.getElementById("btn-merge").onclick = async () => {
  const brs = await api("GET", "/api/version/branches");
  const others = brs.branches.filter(b => b.name !== brs.head_branch);
  if (!others.length) return toast("没有可合并的其它分支", "warn");
  const body = document.createElement("div");
  body.innerHTML = `
    <div class="form-row" style="margin-bottom:12px">
      <label class="fl" style="flex:1">源分支（被合并方）
        <select id="mg-src">${others.map(b =>
          `<option value="${esc(b.name)}">${esc(b.name)} · ${esc(b.last_message || "").slice(0, 24)}</option>`).join("")}
        </select></label>
      <label class="fl" style="flex:1">目标分支
        <span style="display:flex;gap:6px;align-items:center">
          <input type="text" id="mg-dst" value="${esc(brs.head_branch)}" readonly style="flex:1">
          <button type="button" class="btn sm ghost" id="mg-run">预检</button>
        </span></label>
    </div>
    <div class="small muted">先做只读三方预演：不物化工作区、不创建提交；风险会定位到文件和行段。</div>
    <div id="mg-impact" style="margin-top:12px;max-height:52vh;overflow-y:auto"><div class="impact-empty">正在加载预演…</div></div>
    <label id="mg-ack-wrap" class="small" style="display:none;margin-top:8px">
      <input type="checkbox" id="mg-ack"> 我已查看具体冲突文件和原因，仍要执行合并
    </label>`;
  const m = modal({
    title: "合并前影响分析", body, wide: true, okText: "执行合并",
    onOk: async (bodyEl) => {
      const d = bodyEl._impact;
      if (!d) { toast("请先运行预检", "warn"); return false; }
      if (d.stats.risk_high && !bodyEl.querySelector("#mg-ack").checked) {
        toast("请先勾选确认已了解高风险冲突", "warn");
        return false;
      }
      const src = bodyEl.querySelector("#mg-src").value;
      const dst = bodyEl.querySelector("#mg-dst").value;
      const out = bodyEl.querySelector("#mg-impact");
      out.insertAdjacentHTML("beforeend", `<div class="small muted">正在执行合并 …</div>`);
      try {
        const r = await api("POST", "/api/version/merge", { source: src, target: dst });
        if (r.kind === "noop") {
          out.insertAdjacentHTML("beforeend", `<div class="badge ok plain">${esc(r.message || "已是最新")}</div>`);
          return false;
        }
        let html = `<div class="trace-box">
          <div class="step">${r.kind === "fast-forward" ? "⚡ 快进合并完成" : "✔ 合并提交已创建"}：
            <span class="chip">${esc(r.commit.short)}</span> ${esc(r.commit.message)}</div>
          <div class="step">文件变更 ${r.stats.files_changed ?? "-"} · base ${esc(r.base || "-")}</div>`;
        if (r.conflicts && r.conflicts.length) {
          html += `<div class="step" style="color:var(--bad)">⚠ ${r.conflicts.length} 处冲突（已写入冲突标记，提交后需人工解决）：</div>`;
          html += r.conflicts.map(c => `
            <div class="step">
              <a href="diff.html?path=${encodeURIComponent(c.path)}&a=${encodeURIComponent(r.commit.id)}" class="cf-file">${esc(c.path)}</a>
              <span class="badge bad plain">${esc(c.kind)}</span>
              <span class="small muted">${esc(c.detail || "")}</span>
            </div>`).join("");
        }
        html += `</div>`;
        out.insertAdjacentHTML("beforeend", html);
        toast(r.conflicts?.length ? `合并完成，但有 ${r.conflicts.length} 处冲突` : "合并完成",
              r.conflicts?.length ? "warn" : "ok");
        loadAll();
        return false;
      } catch (e) {
        out.insertAdjacentHTML("beforeend", `<div class="badge bad plain">${esc(e.message)}</div>`);
        return false;
      }
    }
  });
  async function runPreview() {
    const src = body.querySelector("#mg-src").value;
    const dst = body.querySelector("#mg-dst").value;
    body.querySelector("#mg-impact").innerHTML = `<div class="impact-empty">正在预演 ${esc(src)} → ${esc(dst)} …</div>`;
    m.el.querySelector(".m-ok").disabled = true;
    try {
      const d = await api("POST", "/api/version/merge_preview", { source: src, target: dst });
      body._impact = d;
      body.querySelector("#mg-impact").innerHTML = renderImpactReport(d, { link: false });
      body.querySelector("#mg-ack-wrap").style.display = d.stats.risk_high ? "" : "none";
      m.el.querySelector(".m-ok").disabled = false;
    } catch (e) {
      body._impact = null;
      body.querySelector("#mg-impact").innerHTML = `<div class="badge bad plain">预检失败：${esc(e.message)}</div>`;
    }
  }
  body.querySelector("#mg-src").onchange = runPreview;
  body.querySelector("#mg-run").onclick = runPreview;
  runPreview();
};

// ------------------------------------------------------------------ 检出
document.getElementById("btn-checkout").onclick = () => {
  confirmDlg(`检出分支 ${curBranch}？其头提交快照将物化到文件系统（未提交修改会自动提交保护）。`,
    async () => {
      try {
        const r = await api("POST", "/api/version/checkout", { branch: curBranch });
        toast(`已检出 ${r.branch}${r.auto_commit ? "（自动提交 " + r.auto_commit.short + "）" : ""}`, "ok");
        headBranch = r.branch;
        loadAll();
      } catch (e) { toast("检出失败：" + e.message, "bad"); }
    });
};

// ------------------------------------------------------------------ 文件历史
async function showFileHistory(path) {
  document.getElementById("file-hist-card").style.display = "";
  document.getElementById("fh-title").innerHTML =
    `<span class="mono small">${esc(path)}</span>`;
  const box = document.getElementById("fh-body");
  box.innerHTML = `<div class="small muted">加载中 …</div>`;
  try {
    const d = await api("GET", `/api/version/history?path=${encodeURIComponent(path)}&branch=${encodeURIComponent(curBranch)}`);
    if (!d.history.length) { box.innerHTML = `<div class="empty small">该文件暂无版本记录</div>`; return; }
    box.innerHTML = d.history.map(h => `
      <div style="padding:7px 2px;border-bottom:1px dashed var(--border-soft)">
        <div style="display:flex;gap:8px;align-items:center">
          <span class="chip">${esc(h.commit.short)}</span>
          <span class="badge plain ${h.state === "deleted" ? "bad" : "ok"}">${h.state}</span>
          <span class="spacer" style="flex:1"></span>
          <button class="btn xs fh-view" data-ref="${esc(h.commit.id)}">查看</button>
          ${h.state !== "deleted" ? `<button class="btn xs fh-restore" data-ref="${esc(h.commit.id)}" title="把该版本恢复为当前文件">↩ 恢复</button>` : ""}
        </div>
        <div class="small muted mono" style="margin-top:2px">${esc(h.commit.message).slice(0, 38)} · ${fmtAgo(h.commit.ts)}</div>
      </div>`).join("");
    box.querySelectorAll(".fh-view").forEach(b => b.onclick = () => {
      location.href = `diff.html?a=${encodeURIComponent(b.dataset.ref)}&b=WORKING&path=${encodeURIComponent(path)}`;
    });
    box.querySelectorAll(".fh-restore").forEach(b => b.onclick = async () => {
      confirmDlg(`把 ${path} 恢复到 ${b.dataset.ref.slice(0, 12)} 的版本？`, async () => {
        try {
          await api("POST", "/api/version/restore", { ref: b.dataset.ref, path });
          toast("已恢复到工作区（记得提交）", "ok");
          loadAll();
        } catch (e) { toast(e.message, "bad"); }
      });
    });
  } catch (e) { box.innerHTML = `<div class="empty small">${esc(e.message)}</div>`; }
}
document.getElementById("fh-close").onclick = () =>
  document.getElementById("file-hist-card").style.display = "none";

// ------------------------------------------------------------------ 统计
async function loadRepoStats() {
  const s = await api("GET", "/api/version/stats");
  document.getElementById("repo-stats").innerHTML = `
    <span class="k">提交总数</span><span class="v">${s.commits}</span>
    <span class="k">分支数</span><span class="v">${s.branches}</span>
    <span class="k">HEAD</span><span class="v">${esc(s.head_branch)}</span>
    <span class="k">合并提交</span><span class="v">${s.merge_commits}</span>
    <span class="k">含冲突提交</span><span class="v">${s.conflicted_commits}</span>
    <span class="k">首次提交</span><span class="v">${s.first_ts ? fmtTs(s.first_ts) : "-"}</span>`;
}

// ------------------------------------------------------------------ 汇总
async function loadAll() {
  await Promise.all([loadBranches(), loadTimeline(), loadRepoStats()]);
}

initPage("versions.html", "版本历史").then(() => {
  loadAll().catch(e => toast(e.message, "bad"));
  const p = DFSVS.qs("path");
  if (p) showFileHistory(p);
  DFSVS.poll(loadBranches, 10000);
});
</script>
</body>
</html>
